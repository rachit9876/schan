<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#0a0a0c">
    <title>⭐ SCHAN</title>
    <link rel="manifest" href="json/manifest.json">
    <link rel="icon" href="assets/image.webp">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo" onclick="window.location.href='/'"><span>⭐</span> SCHAN</div>
        <div class="nav-actions">
            <span id="version-display" style="font-size: 12px; color: var(--text-secondary);"></span>
            <button id="clear-history-btn" title="Clear Watch History">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
            </button>
        </div>
    </header>

    <main>
        <section class="hero">
            <div class="hero-bg" id="hero-bg"></div>
            <div class="hero-gradient"></div>
            <div class="hero-content">
                <h1 class="hero-title" id="hero-title">Loading...</h1>
                <p class="hero-desc">Your ultimate childhood cartoon vault. Stream seamlessly across all devices.</p>
                <button class="btn-solid" id="hero-play" disabled>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg> Play Now
                </button>
            </div>
        </section>

        <section class="container">
            <h2 class="section-title">All Shows</h2>
            <div class="grid" id="shows-grid"></div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
